[package]
name = "audioadapter"
version = "2.0.2"
edition = "2021"
rust-version = "1.74"
authors = ["HEnquist <henrik.enquist@gmail.com>"]
description = "A library for making it easier to work with buffers of audio data"
license = "MIT"
repository = "https://github.com/HEnquist/audioadapter-rs"
keywords = ["audio", "buffer", "dsp", "sample", "pcm"]
categories = ["multimedia::audio"]
readme = "README.md"

[features]
default = ["std", "audio"]
std = ["num-traits/std", "audio-core?/std", "audio/std"]
audio = ["audio-core"]

test-utils = []

[dependencies]
num-traits.workspace = true
audio-core = { workspace = true, optional = true }

[dev-dependencies]
audio = { version = "0.2.0", default-features = false }
criterion = "0.6"

[[bench]]
name = "sqrt"
harness = false
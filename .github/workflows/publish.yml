on:
  push:
    tags:
      - '*'

name: Publish on crates.io

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Publish audioadapter crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          output=$(cargo publish -p audioadapter --token ${CARGO_REGISTRY_TOKEN} 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Publish failed (audioadapter)::cargo publish exited with code $status. See log above."
          fi
          exit 0

      - name: Publish sample crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          output=$(cargo publish -p audioadapter-sample --token ${CARGO_REGISTRY_TOKEN} 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Publish failed (audioadapter-sample)::cargo publish exited with code $status. See log above."
          fi
          exit 0

      - name: Publish buffers crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          output=$(cargo publish -p audioadapter-buffers --token ${CARGO_REGISTRY_TOKEN} 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Publish failed (audioadapter-buffers)::cargo publish exited with code $status. See log above."
          fi
          exit 0




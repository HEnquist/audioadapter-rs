on:
  push:
    tags:
      - '*'

name: Publish on crates.io

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Publish audioadapter crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          output=$(cargo publish -p audioadapter --token ${CARGO_REGISTRY_TOKEN} 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Publish failed (audioadapter)::cargo publish exited with code $status. See log above."
          fi
          exit 0

      - name: Publish sample crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          output=$(cargo publish -p audioadapter-sample --token ${CARGO_REGISTRY_TOKEN} 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Publish failed (audioadapter-sample)::cargo publish exited with code $status. See log above."
          fi
          exit 0

      - name: Publish buffers crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          output=$(cargo publish -p audioadapter-buffers --token ${CARGO_REGISTRY_TOKEN} 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Publish failed (audioadapter-buffers)::cargo publish exited with code $status. See log above."
          fi
          exit 0

      - name: Publish stats crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          output=$(cargo publish -p audioadapter-stats --token ${CARGO_REGISTRY_TOKEN} 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Publish failed (audioadapter-stats)::cargo publish exited with code $status. See log above."
          fi
          exit 0

      # The compat crates depend on `audioadapter`, which is published above, so
      # they must come after it. They do not depend on each other.
      - name: Publish compat crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          for crate in \
            audioadapter-compat-audio \
            audioadapter-compat-symphonia \
            audioadapter-compat-dasp \
            audioadapter-compat-ndarray \
            audioadapter-compat-nice-plug; do
            output=$(cargo publish -p "$crate" --token ${CARGO_REGISTRY_TOKEN} 2>&1)
            status=$?
            echo "$output"
            if [ $status -ne 0 ]; then
              echo "::warning title=Publish failed ($crate)::cargo publish exited with code $status. See log above."
            fi
          done
          exit 0


on: [push, pull_request]

name: CI test and lint

jobs:
  check_test:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo check
        run: cargo check --workspace --all-targets

      - name: Run cargo test
        run: cargo test --workspace --all-targets

      - name: Run rustdoc checks
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

      - name: Compile benches
        run: cargo bench --workspace --no-run

      - name: Run cargo check no features
        run: cargo check --workspace --no-default-features

      - name: Run cargo check no features all targets
        run: cargo check --workspace --all-targets --no-default-features

      - name: Run cargo test no features
        run: cargo test --workspace --no-default-features

  publish_dry_run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run publish audioadapter crate
        id: dry_run_audioadapter
        continue-on-error: true
        run: cargo publish --dry-run -p audioadapter

      - name: Warn if audioadapter dry-run failed
        if: steps.dry_run_audioadapter.outcome == 'failure'
        run: echo "::warning::cargo publish --dry-run failed for audioadapter. This can happen when dependent crate versions are not yet available on crates.io; please review manually before merge."

      - name: Dry-run publish sample crate
        id: dry_run_sample
        continue-on-error: true
        run: cargo publish --dry-run -p audioadapter-sample

      - name: Warn if sample dry-run failed
        if: steps.dry_run_sample.outcome == 'failure'
        run: echo "::warning::cargo publish --dry-run failed for audioadapter-sample. This can happen when dependent crate versions are not yet available on crates.io; please review manually before merge."

      - name: Dry-run publish buffers crate
        id: dry_run_buffers
        continue-on-error: true
        run: cargo publish --dry-run -p audioadapter-buffers

      - name: Warn if buffers dry-run failed
        if: steps.dry_run_buffers.outcome == 'failure'
        run: echo "::warning::cargo publish --dry-run failed for audioadapter-buffers. This can happen when dependent crate versions are not yet available on crates.io; please review manually before merge."

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

on: [push, pull_request]

name: CI test and lint

jobs:
  check_test:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo check
        run: cargo check --workspace --all-targets

      - name: Run cargo test
        run: cargo test --workspace --all-targets

      - name: Run rustdoc checks
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

      - name: Compile benches
        run: cargo bench --workspace --no-run

      - name: Run cargo check no features
        run: cargo check --workspace --no-default-features

      - name: Run cargo check no features all targets
        run: cargo check --workspace --all-targets --no-default-features

      - name: Run cargo test no features
        run: cargo test --workspace --no-default-features

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      # Use the lowest `rust-version` declared by any crate in the workspace,
      # so that this job never disagrees with the manifests. Picking the lowest
      # also catches a crate that declares an older version than its
      # dependencies actually need, since `cargo` then refuses to build it.
      - name: Read MSRV
        id: msrv
        run: |
          version=$(grep -h '^rust-version' */Cargo.toml compat/*/Cargo.toml | cut -d '"' -f 2 | sort -V | head -1)
          echo "Lowest declared rust-version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Run cargo check
        run: cargo check --workspace --all-targets --all-features

  publish_dry_run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run publish audioadapter crate
        run: |
          set +e
          output=$(cargo publish --dry-run -p audioadapter 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Dry-run failed (audioadapter)::cargo publish --dry-run exited with code $status. See log above."
          fi
          exit 0

      - name: Dry-run publish sample crate
        run: |
          set +e
          output=$(cargo publish --dry-run -p audioadapter-sample 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Dry-run failed (audioadapter-sample)::cargo publish --dry-run exited with code $status. See log above."
          fi
          exit 0

      - name: Dry-run publish buffers crate
        run: |
          set +e
          output=$(cargo publish --dry-run -p audioadapter-buffers 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "::warning title=Dry-run failed (audioadapter-buffers)::cargo publish --dry-run exited with code $status. See log above."
          fi
          exit 0

      - name: Dry-run publish compat crates
        run: |
          set +e
          for crate in \
            audioadapter-compat-audio \
            audioadapter-compat-symphonia \
            audioadapter-compat-dasp \
            audioadapter-compat-ndarray \
            audioadapter-compat-nice-plug; do
            output=$(cargo publish --dry-run -p "$crate" 2>&1)
            status=$?
            echo "$output"
            if [ $status -ne 0 ]; then
              echo "::warning title=Dry-run failed ($crate)::cargo publish --dry-run exited with code $status. See log above."
            fi
          done
          exit 0

  release_checks:
    name: Release readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      # This job answers "could we tag a release right now?", so a red cross is
      # the normal state during development and green means ready to release.
      # Do not silence it by dating a section that is not being released.
      #
      # It is informational and is deliberately not a required check, so it does
      # not block merging. Each check appends to a findings file and the last
      # step fails if that file has anything in it.
      - name: Prepare findings
        run: 'echo -n > "$RUNNER_TEMP/findings.md"'

      # Semver-compatible updates are picked up by cargo on its own, so they are
      # not interesting here. What needs a human is an update that cargo refuses
      # to make, either because it is semver-incompatible or because it needs a
      # newer Rust than the MSRV. `cargo update --dry-run --verbose` reports
      # exactly those as "Unchanged <crate> vA (available: vB)".
      - name: Check for new releases of the targeted crates
        run: |
          # `kind == null` is a normal dependency. Dev- and build-dependencies
          # are test and build scaffolding rather than crates a compat crate
          # integrates with, so they would only add noise here.
          targets=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[]
                     | select(.name | startswith("audioadapter-compat-"))
                     | .dependencies[]
                     | select(.kind == null)
                     | .name' \
            | grep -v '^audioadapter' | sort -u || true)
          echo "Crates targeted by the compat crates: $(echo $targets | tr '\n' ' ')"
          behind=$(cargo update --dry-run --verbose 2>&1 | grep 'Unchanged' || true)
          for name in $targets; do
            line=$(echo "$behind" | grep -E "^[[:space:]]*Unchanged $name v" || true)
            if [ -z "$line" ]; then
              echo "$name: up to date"
              continue
            fi
            versions=$(echo "$line" | sed -E 's/.*Unchanged ([^ ]+) v([^ ]+) \(available: v([^)]+)\).*/\2 \3/')
            echo "::warning title=New release available ($name)::In use: ${versions% *}, available: ${versions#* }. Cargo cannot take this update on its own, so it needs a manual retarget."
            echo "- \`$name\`: in use ${versions% *}, available ${versions#* }. Cargo cannot take this update on its own, so it needs a manual retarget." >> "$RUNNER_TEMP/findings.md"
          done

      # The newest changelog section must carry its release date by the time a
      # tag is pushed, since pushing a tag publishes the crates straight away.
      # Checking on every push means the reminder is visible while there is
      # still a chance to act on it, rather than after the release is already
      # out. Expect this one to report during normal development, when the
      # newest heading is `Unreleased`.
      - name: Check that the changelog is dated
        if: always()
        run: |
          heading=$(grep -m1 '^## ' CHANGELOG.md || true)
          echo "Newest changelog section: $heading"
          if ! echo "$heading" | grep -qE '^## [0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]*$'; then
            echo "::warning title=Changelog section is undated::The newest section of CHANGELOG.md is \"$heading\", which is not a release date. Replace the heading with the release date, as ## YYYY-MM-DD, before tagging a release."
            echo "- Changelog: the newest section is \`$heading\`, which is not a release date. Replace the heading with the release date, as \`## YYYY-MM-DD\`, before tagging a release." >> "$RUNNER_TEMP/findings.md"
          fi

      - name: Report
        if: always()
        run: |
          if [ ! -s "$RUNNER_TEMP/findings.md" ]; then
            echo "Ready to release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Not ready to release"
            echo
            cat "$RUNNER_TEMP/findings.md"
            echo
            echo "This job is informational and does not block merging. It is"
            echo "expected to be red until the changes are ready to be tagged."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
